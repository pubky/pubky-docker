[api]
name = "nexusd.api"
public_ip = "172.18.0.3"
public_addr = "0.0.0.0:8080"
pubky_listen_socket = "0.0.0.0:8081"

[watcher]
name = "nexusd.watcher"
homeserver = "8pinxxgqs41n4aididenw5apqp1urfmzdztr8jt4abrkdn435ewo"
events_limit = 1000
monitored_homeservers_limit = 0
watcher_sleep = 100
moderation_id = "xw4fdy5kpc9aoowabmhqmd7wnuz3pqg7z1usse877tawtu8x7zdy"
moderated_tags = []

[stack]
log_level = "debug"
files_path = "/static/files/"

[stack.net]
testnet = true
testnet_host = "homeserver"

[stack.db]
redis = "redis://nexus-redis:6379"

[stack.db.neo4j]
uri = "bolt://nexus-neo4j:7687"
password = "12345678"

# Nightly recompute of the seeded PageRank trust scores that rank the
# starter-pack stream. Without a schedule the job never fires and every score
# stays null, which silently degrades that ranking to endorsement counts.
[jobs.trust-recompute]
cron = "0 0 3 * * *"

[trust_rank]
# PLACEHOLDER, must be replaced before this has any effect. Trust radiates from
# these accounts, so the list decides what the whole graph considers reputable.
# The job refuses to run while this is empty.
seed = []
